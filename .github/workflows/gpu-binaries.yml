# Builds `gpuinfo` for the three platforms and uploads it, so that somebody with hardware nobody
# here owns can run it without installing Rust.
#
# Deliberately not the `*-binaries.yml` workflows next to this one. Those commit executables into
# `bin/`, only run on `main`, and refuse to run in a fork on purpose -- a fork rebuilding `bin/`
# has cost this project several submissions. This one commits nothing: it attaches the executables
# to the run as artifacts, which is the right shape for handing one to a tester and leaves no trace
# in the tree.
#
# `gpuinfo` needs no data files, no snapshot and no game. It opens a device, checks it against the
# processor on the same bytes, and writes a report. That is the whole thing somebody is being asked
# to run, and it should cost them a download and ten seconds.

name: gpu binaries

on:
  workflow_dispatch:
  # Also on this branch. A `workflow_dispatch` is only offered for files that are already on the
  # default branch, and this branch's whole point is that it is not there yet -- so it triggers on
  # its own pushes rather than being merged early just to become runnable.
  push:
    branches: [main, 'gpu/**']
    paths:
      - 'src/adapters/**'
      - 'src/ports/**'
      - 'src/bin/gpuinfo.rs'
      - '.github/workflows/gpu-binaries.yml'

concurrency:
  group: gpu-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not deny the others to whoever is waiting for them.
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            binary: gpuinfo.exe
            rustflags: -C target-feature=+crt-static
          # Not `ubuntu-latest`. A binary built against a newer glibc refuses to start on an older
          # distribution, and the person being asked to run this did not volunteer to debug that.
          # 22.04's glibc is old enough to cover nearly everything still in use.
          - name: linux
            runner: ubuntu-22.04
            binary: gpuinfo
            rustflags: ''
          - name: macos
            runner: macos-latest
            binary: gpuinfo
            rustflags: ''

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Windows links Microsoft's C runtime dynamically by default, which means the executable
      # needs vcruntime140.dll to start. Nearly every Windows machine has it -- every game
      # installs it -- and nearly is not the promise being made. Somebody is being asked to run
      # one file and send back a report, and "install the Visual C++ redistributable first" is
      # exactly the round trip this whole thing exists to avoid.
      #
      # Static linking costs a few hundred kilobytes and removes the dependency entirely.
      - run: cargo build --release --bin gpuinfo
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Proof the thing runs at all before it is handed to anybody. On a runner with no graphics
      # driver it prints that it found no device and exits zero, which is the correct behaviour and
      # is worth confirming: it is what every contributor without a GPU will see.
      - name: run it once
        run: ./target/release/${{ matrix.binary }} --small

      - uses: actions/upload-artifact@v4
        with:
          name: gpuinfo-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          # Long enough to matter, short enough that a stale executable does not go on being
          # handed out after the kernel has moved.
          retention-days: 30
