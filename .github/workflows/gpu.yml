# Checks the GPU adapter on hardware nobody involved actually owns.
#
# The constraint this workflow exists to work around: the kernel has to run on AMD cards, Intel
# iGPUs and NVIDIA cards, and no contributor here has all three. Buying the hardware is not an
# option and waiting for a bug report is not a plan, so everything below is a way of finding a
# portability bug without the device that would have shown it.
#
# Four independent nets, in increasing order of what they catch:
#
#   1. AMD's own backend, all the way to machine code. `clang -target amdgcn` is the same LLVM
#      backend ROCm and Mesa both use, so a crash or a rejection here is a crash or a rejection
#      on a real Radeon. It also prints register and spill counts, which answers the one
#      performance question that cannot be answered by reading the source.
#
#   2. A second OpenCL implementation. PoCL is conformant, LLVM-based and runs on a plain CPU
#      runner. Most of what a vendor's compiler will reject, PoCL rejects too -- and unlike a GPU
#      driver it says why. This is the net that catches "NVIDIA let me get away with it".
#
#   3. A simulator that bounds-checks. Oclgrind interprets the kernel and validates every memory
#      access and every barrier. It is how an out-of-bounds read that happens to land inside a
#      real driver's own allocation gets found, and it has already earned its place: when Mesa
#      faulted running the peel kernel, this is what proved the kernel was in bounds and the
#      fault was Mesa's.
#
#   4. Mesa. Rusticl compiles OpenCL C the same way for every backend it has -- clc to SPIR-V to
#      NIR -- so running it on the CPU driver exercises the exact front end it uses on a Radeon.
#
# None of the four is a GPU. Together they are the difference between shipping a kernel that has
# been reasoned about and one that has been checked.

name: gpu

on:
  pull_request:
    paths:
      - "src/ports/**"
      - "src/adapters/**"
      - "src/search.rs"
      - "src/bin/gpuinfo.rs"
      - "tests/backend.rs"
      - ".github/workflows/gpu.yml"
  # Also on this branch. A `workflow_dispatch` is only offered for files that are already on the
  # default branch, and this branch's whole point is that it is not there yet -- so it triggers on
  # its own pushes rather than being merged early just to become runnable.
  push:
    branches: [main, 'gpu/**']
  workflow_dispatch:

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Only the new files. The rest of this repository is not rustfmt-clean and reformatting it
      # would bury the adapter under a thousand-line diff that says nothing, which is a worse
      # outcome than an inconsistent repository.
      - name: format
        run: |
          rustfmt --edition 2021 --check \
            src/ports/*.rs \
            src/adapters/*.rs \
            src/adapters/opencl/*.rs \
            src/bin/gpuinfo.rs \
            tests/backend.rs

      # Not `-D warnings`: same argument as above. The modules that *are* new carry
      # `#[deny(warnings, clippy::all, unsafe_op_in_unsafe_fn)]` in `lib.rs`, so a lint in the
      # adapter is already a hard error without making one in `submit.rs` into one too.
      - run: cargo clippy --all-targets

      # Miri cannot cross an FFI boundary -- it interprets Rust and there is no OpenCL driver to
      # interpret -- so it is pointed at the half that is pure arithmetic. That half is the
      # packing, and the packing decides what every device reads.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --test backend packing_
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  amdgpu:
    name: AMD's backend, to machine code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      # Compiling, not running -- but all the way down, not just parsing. `-fsyntax-only` would
      # check that AMD's front end accepts the source; this checks that its *backend* can turn it
      # into instructions, which is where a portability failure of the kind already seen on Intel
      # actually lives.
      #
      # `-nogpulib` because the ROCm device library is not packaged here. The OpenCL builtins are
      # left as external calls, which costs nothing: every line of arithmetic in this kernel still
      # goes through the full backend.
      - name: compile for five generations of Radeon
        run: |
          set -e
          # gfx900  Vega / GCN5      gfx1010 RDNA1
          # gfx1030 RDNA2, RX 6000   gfx1100 RDNA3, RX 7900
          # gfx1200 RDNA4, RX 9000
          for cpu in gfx900 gfx1010 gfx1030 gfx1100 gfx1200; do
            clang -x cl -cl-std=CL1.2 -Xclang -finclude-default-header \
                  -target amdgcn-amd-amdhsa -mcpu="$cpu" -nogpulib \
                  -O3 -S -o "/tmp/$cpu.s" \
                  src/adapters/opencl/kernels/meet.cl

            vgpr=$(grep -m1 -oE '\.vgpr_count: *[0-9]+' "/tmp/$cpu.s" | grep -oE '[0-9]+' || echo '?')
            spill=$(grep -c 'scratch_store' "/tmp/$cpu.s" || true)

            echo "$cpu: vgpr=$vgpr scratch stores=$spill"

            # The unrolled fold keeps a stem in registers across every beginning, and a compiler
            # that spills it instead produces a kernel that is correct and several times slower.
            # That is a silent failure on hardware nobody here owns, so it fails loudly here.
            if [ "$spill" -ne 0 ]; then
              echo "::error::$cpu spills to scratch memory: the fold no longer stays in registers"
              exit 1
            fi
          done

      # Intel's front end, for the same reason, on the same source.
      - name: compile for Intel
        run: |
          clang -x cl -cl-std=CL1.2 -Xclang -finclude-default-header \
                -target spir64-unknown-unknown -Werror -fsyntax-only \
                src/adapters/opencl/kernels/meet.cl

  pocl:
    name: a second OpenCL implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `pocl-opencl-icd` brings the loader with it, which also proves the runtime loading works:
      # nothing here links against OpenCL, so if the adapter finds PoCL it found it the same way
      # it will find a driver on a contributor's machine.
      - name: install PoCL
        run: |
          sudo apt-get update
          sudo apt-get install -y pocl-opencl-icd clinfo
          clinfo --list

      - run: cargo build --release --bin gpuinfo

      # PoCL's device is the runner's own cores and reports itself as a CPU, which the adapter
      # refuses in a real run for good reason -- it would be slower than the thread pool. Without
      # this variable this job enumerates nothing and passes, which is worse than not having it.
      - run: ./target/release/gpuinfo
        env:
          SLASHER_GPU_ALLOW_CPU: "1"

      # One thread. PoCL faults, intermittently, when two OpenCL contexts are created at once in
      # one process -- which the test binary does, because two of its tests each open a device of
      # their own. Reproduced on a four-core machine: parallel faults most runs, single-threaded
      # passes twelve out of twelve. It is not the guard (it faults with the guard disabled and
      # with the probe binary removed), and it is not this adapter's sharing, because each device
      # has its own context and its own queue and shares nothing between them. NVIDIA and Intel
      # run these same tests in parallel without complaint.
      #
      # Serialised only here, and only for that reason. A real pass opens one device per process,
      # so nothing about this reaches anybody grinding. If it were made a blanket
      # `--test-threads=1` it would stop being a statement about PoCL and start being a place for
      # a genuine concurrency bug to hide.
      # PoCL is installed by the step above specifically so the differential has something to
      # compare against. Without this the test would skip when the ICD is not picked up, and a
      # skipped test and a passing test are the same line in a log -- the job would go green having
      # compared nothing at all.
      - run: cargo test --release --test backend -- --test-threads=1
        env:
          SLASHER_GPU_ALLOW_CPU: "1"
          SLASHER_GPU_REQUIRED: "1"

  oclgrind:
    name: bounds and races in the kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: install Oclgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y oclgrind

      - run: cargo build --release --bin gpuinfo

      # Every invalid access is reported. A kernel that reads one byte past a buffer is usually
      # invisible on real hardware, because the allocation it runs into is its own -- and is a
      # wrong answer on the one device whose allocator is arranged differently.
      #
      # The stem window is why this is here specifically: the kernel reads a fixed thirty-two
      # bytes from the start of every stem regardless of how long that stem is, which is safe only
      # because the host pads the buffer.
      #
      # `--small` because interpreting and bounds-checking every access costs about a hundred
      # times a CPU. The checks are the same; there are fewer candidates in them.
      - name: run the selftest under the simulator
        run: |
          oclgrind --data-races --uninitialized --check-api \
                   ./target/release/gpuinfo --small

  mesa:
    name: Mesa's front end, the one a Radeon uses
    runs-on: ubuntu-latest
    # Rusticl faults executing the peel kernel as of Mesa 25.2. Oclgrind clears the same kernel of
    # every out-of-bounds access and Rusticl runs the sweep correctly, so this is Mesa's and not
    # ours -- but it is upstream and not ours to fix, so it must not block a pull request. It stays
    # because it will start passing, and because the sweep half is checked meanwhile.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Nothing else. Mesa's OpenCL links its own LLVM, and installing a distribution `llvm` next
      # to it is enough to make the loader find no platform at all -- and then this job passes for
      # entirely the wrong reason.
      - name: install Mesa's OpenCL
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-opencl-icd clinfo
          RUSTICL_ENABLE=llvmpipe clinfo --list

      - run: cargo build --release --bin gpuinfo

      - run: ./target/release/gpuinfo --small
        env:
          RUSTICL_ENABLE: llvmpipe
          SLASHER_GPU_ALLOW_CPU: "1"

  windows:
    name: builds where the contributors are
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # No OpenCL on the runner, which is the case worth checking on Windows: the binary has to
      # build, start, and quietly decide there is no device. A build that needed OpenCL.dll to
      # link would pass every test here and fail on the first machine without a graphics driver.
      - run: cargo build --release --bin gpuinfo
      - run: cargo test --release --test backend
      - run: ./target/release/gpuinfo.exe
